<template>
  <lightning-card
    title="Correct Opportunity Products"
    icon-name="standard:product"
  >
    <lightning-button
      slot="actions"
      data-id="ai-review-button"
      label="AI Review"
      icon-name="utility:sparkles"
      disabled={isReviewing}
      onclick={handleAiReview}
    ></lightning-button>
    <div class="slds-p-horizontal_medium slds-is-relative">
      <template lwc:if={error}>
        <p class="slds-text-color_error" data-id="error">{error}</p>
      </template>
      <template lwc:elseif={hasRows}>
        <lightning-input
          data-id="reason"
          label="Reason for correction"
          value={reason}
          max-length="255"
          required
          onchange={handleReasonChange}
        ></lightning-input>
        <div class="slds-m-top_small">
          <lightning-datatable
            key-field="Id"
            data={rows}
            columns={columns}
            draft-values={draftValues}
            hide-checkbox-column
            onsave={handleSave}
            oncancel={handleCancel}
          ></lightning-datatable>
        </div>
        <template lwc:if={isReviewing}>
          <p class="slds-m-top_medium slds-text-color_weak">
            Reviewing product lines with Einstein…
          </p>
        </template>
        <template lwc:if={aiReview}>
          <div
            class="slds-box slds-theme_shade slds-m-top_medium"
            data-id="ai-review"
          >
            <p class="slds-text-title_bold slds-m-bottom_x-small">
              AI product health review
            </p>
            <p class="ai-review-text">{aiReview}</p>
            <p
              class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
            >
              Generated by Einstein from the pricing rules. Check before acting.
            </p>
          </div>
        </template>
      </template>
      <template lwc:else>
        <p data-id="empty">This opportunity has no products yet.</p>
      </template>
      <template lwc:if={isSaving}>
        <lightning-spinner
          alternative-text="Saving corrections"
        ></lightning-spinner>
      </template>
    </div>
  </lightning-card>
</template>
